<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sharks — 3D 낚시</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1630;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5}
#top{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.chips{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip{background:rgba(8,18,40,.62);border-radius:12px;padding:6px 10px;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.chip.small{font-size:12px;font-weight:600;opacity:.92}
#topR{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.btn{background:rgba(20,40,72,.8);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:800;cursor:pointer;touch-action:manipulation;font-family:inherit}
.btn:active{transform:scale(.95)}
#fishBtn{right:calc(18px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;font-size:17px;font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,#6cc4ff,#1565c0);border:3px solid rgba(255,255,255,.7);box-shadow:0 4px 16px #0008;touch-action:none;font-family:inherit}
#fishBtn.hot{background:radial-gradient(circle at 35% 30%,#ffe082,#f57c00)}
#runBtn{right:calc(130px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;padding:0;font-size:13px;display:none;touch-action:none}
#runBtn.on{background:#2e7d32}
#joy{left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);display:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none}
.touch #joy,.touch #runBtn{display:block}
.touch #help{display:none}
#power{left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);width:230px;height:18px;border-radius:9px;background:#000a;border:2px solid #fff8;display:none;overflow:hidden}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336)}
#bite{left:50%;top:26%;transform:translate(-50%,-50%);font-size:72px;font-weight:900;color:#ffeb3b;text-shadow:0 0 14px #000,0 0 4px #000;display:none;pointer-events:none;animation:pulse .25s infinite alternate}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.25)}}
#reel{right:calc(134px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:none;gap:6px;align-items:stretch;pointer-events:none}
#rbar{position:relative;width:46px;height:min(300px,46vh);background:rgba(8,40,80,.85);border:3px solid #fff9;border-radius:10px;overflow:hidden}
#zone{position:absolute;left:2px;right:2px;bottom:0;height:20%;background:rgba(80,230,110,.75);border-radius:6px;border:2px solid #b9ffc8}
#rfish{position:absolute;left:50%;bottom:50%;width:32px;height:24px;margin:0 0 -12px -16px;font-size:22px;line-height:24px;text-align:center}
#rprog{position:relative;width:14px;background:#000a;border:2px solid #fff6;border-radius:7px;overflow:hidden}
#rpf{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(0deg,#ffb300,#fff176)}
#card{left:50%;top:18%;transform:translate(-50%,0) scale(.8);opacity:0;transition:.25s;background:rgba(8,18,40,.9);border:3px solid #fff;border-radius:16px;padding:12px 18px;text-align:center;pointer-events:none;min-width:220px;max-width:90vw}
#card.show{opacity:1;transform:translate(-50%,0) scale(1)}
#card .cn{font-size:20px;font-weight:900}
#card .new{color:#ffeb3b;font-weight:900;font-size:13px}
#toast{left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.75);padding:8px 14px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:86vw}
#toast.show{opacity:1}
#help{left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;opacity:.75;background:#0006;padding:4px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
#panel{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));touch-action:pan-y}
#panel.open{display:flex}
#pwin{width:min(760px,100%);height:100%;max-height:820px;background:#12213f;border:2px solid #fff3;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
#phead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#0c1830}
#phead b{font-size:16px}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:8px;background:#0c1830;flex-shrink:0;touch-action:pan-x;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 12px;border-radius:10px;background:#1d3260;border:0;color:#cfe0ff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.tab.on{background:#3f7cff;color:#fff}
#pbody{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;margin-bottom:6px;background:#1a2c52;border-radius:10px}
.rn{font-weight:800;font-size:14px;min-width:0}
.rb{background:linear-gradient(90deg,#ff5a5a,#ffb142,#ffe66b,#5fe07a,#4ab0ff,#b06cff);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.rb small{-webkit-text-fill-color:#b8c8e8}
.ri{width:52px;height:52px;flex-shrink:0;border-radius:10px;background:radial-gradient(circle at 40% 35%,#22375f,#0e1b36);border:2px solid;display:flex;align-items:center;justify-content:center}
.rn small{display:block;color:#b8c8e8;font-weight:500;font-size:12px;margin-top:2px}
.b2{background:#2f5bd3;color:#fff;border:0;border-radius:9px;padding:7px 10px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;touch-action:manipulation}
.b2.buy{background:#d38a1f}
.b2.red{background:#c0392b}
.b2:disabled{opacity:.4}
.tag{color:#7dff9a;font-weight:800;font-size:13px;white-space:nowrap}
.lock{color:#ffb3b3;font-size:12px;text-align:right}
.note{font-size:13px;color:#cfe0ff;background:#0e1b36;border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cell{background:#1a2c52;border-radius:10px;padding:7px;font-size:12px;border:2px solid transparent;min-height:46px}
.box{background:#1a2c52;border-radius:12px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.box small{color:#cfe0ff}
.box div:last-child{display:flex;gap:6px;margin-top:4px}
.sw{width:34px;height:34px;border-radius:8px;border:3px solid transparent;display:inline-block;margin:3px;cursor:pointer}
.sw.on{border-color:#fff}
.opt{display:inline-block;margin:3px;padding:7px 10px;border-radius:9px;background:#1d3260;font-weight:700;font-size:13px;cursor:pointer}
.opt.on{background:#3f7cff}
h4{margin:10px 0 4px;font-size:14px}
.gsum{background:#0e1b36;border:2px solid #fff3;border-radius:12px;padding:10px;margin:8px 0;text-align:center}
.gsum .gbest{font-size:20px;font-weight:900;text-shadow:0 0 10px currentColor}
.gsum small{display:block;color:#cfe0ff;margin-top:4px;font-size:12px}
.grow{border-left:5px solid;background:#1a2c52}
.grow.top{box-shadow:0 0 0 2px currentColor inset,0 0 12px currentColor;animation:gpop .5s ease-out}
@keyframes gpop{from{transform:scale(.92);opacity:.3}to{transform:scale(1);opacity:1}}
.row.hl{outline:3px solid #ffeb3b}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:50;background:#0b1630}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top" class="hud">
  <div class="chips"><div class="chip" id="gold">0G</div><div class="chip small" id="info"></div></div>
  <div id="topR"><button class="btn" id="btnView">시점</button><button class="btn" id="btnBoat">배</button><button class="btn" id="btnMenu">메뉴</button></div>
</div>

<div id="panel"><div id="pwin"><div id="phead"><b id="ptitle">메뉴</b><button class="btn" id="pclose">닫기</button></div><div id="tabs"></div><div id="pbody"></div></div></div>
<div id="err">게임을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>

<script>
'use strict';

// ================= 유틸 =================
const $=id=>document.getElementById(id);

function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function rng(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}

// ================= 데이터 =================
const RAR=[
 {n:'일반',c:'#c8ccd2'},{n:'희귀',c:'#5fd068'},{n:'초희귀',c:'#4aa8ff'},{n:'영웅',c:'#b46cff'},

 FISH.push({id,n:s[0],r,m:mi,price:Math.round(RPRICE[r]*m.mult*1.5*(0.9+hash(id+1)*.3)),w0:s[3][0],w1:s[3][1],spd:RSPD[r]*(1+mi*.035)*1.15,shark:1,sj:44,col:s[2],hammer:!!s[4]});
 MAPFISH[mi].push(id);MAPR[mi][r].push(id)});

const HIDDEN=[

 for(let k=0;k<n;k++){let r=rollR(b.p);if(b.pity){S.pity[b.k]=(S.pity[b.k]||0)+1;if(S.pity[b.k]>=b.pity&&r<b.pr)r=b.pr;if(r>=b.pr)S.pity[b.k]=0}

const _enKeys=Object.keys(EN).sort((a,b)=>b.length-a.length);
const _enRe=new RegExp(_enKeys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const HANGUL=/[가-힣]/;
const EXACT={"나":"Me","검":"Swords","배":"Boat","은":"Silver"};
function tr(s){if(S.lang==="ko"||!s||!HANGUL.test(s))return s;if(S.name&&s===S.name)return s;const q=s.trim();if(EXACT[q])return s.replace(q,EXACT[q]);return s.replace(_enRe,m=>EN[m]).replace(/(\d)\s*초/g,"$1s").replace(/(\d)\s*번/g,"$1x").replace(/(\d)\s*종/g,"$1 species").replace(/(\d)\s*개/g,"$1").replace(/(\S)(Fish|Rod|Sword|Shark)\b/g,'$1 $2')}
// 화면 글자 자동 번역(원문은 노드에 보관 → 한국어로 돌아갈 때 복원)
function trNode(n){if(n.nodeType!==3)return;const v=n.nodeValue;if(S.lang==='ko'){if(n.__ko!==undefined&&v===n.__en)n.nodeValue=n.__ko;return}
 if(!HANGUL.test(v))return;const o=tr(v);if(o!==v){n.__ko=v;n.__en=o;n.nodeValue=o}}
function trTree(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())trNode(n)}
const _mo=new MutationObserver(ms=>{if(S.lang==='ko')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else m.addedNodes.forEach(n=>n.nodeType===3?trNode(n):n.nodeType===1&&trTree(n))}});
